<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мои соцсети</title>
  <link rel="icon" href="avatar.jpg">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: #0d0d0d url('bg.jpg') center/cover fixed no-repeat;
      color: #fff;
      display: flex;
      justify-content: center;
      padding: 30px 15px;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(10px);
      padding: 0 16px 24px 16px;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      overflow: hidden;
      transition: max-width 0.3s ease;
    }

    @media (min-width: 768px) {
      .container {
        max-width: 580px;
        padding: 0 24px 28px 24px;
      }
      .header-block {
        width: calc(100% + 48px) !important;
        margin: 0 -24px 12px -24px !important;
        padding: 32px 24px 24px 24px !important;
      }
    }

    .header-block {
      width: calc(100% + 32px);
      margin: 0 -16px 8px -16px;
      padding: 28px 16px 20px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      background: linear-gradient(to bottom, rgba(0, 0, 0, 0.2) 0%, rgba(0, 0, 0, 0.85) 100%), url('header-bg.jpg') center/cover no-repeat;
      border-bottom: none;
    }

    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #ff2a2a;
      box-shadow: 0 0 15px rgba(255, 42, 42, 0.4);
    }

    .title {
      font-size: 22px;
      font-weight: 800;
      color: #ff2a2a;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .subtitle {
      font-size: 14px;
      color: #ccc;
    }

    /* Плеер только на ПК */
    .audio-player {
      display: none;
      width: 100%;
      padding: 10px 16px;
      background: rgba(15, 15, 15, 0.85);
      border: 1.5px solid #ff2a2a;
      border-radius: 16px;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: 0 0 12px rgba(255, 42, 42, 0.25);
    }

    @media (min-width: 768px) {
      .audio-player {
        display: flex;
      }
    }

    .track-info {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      flex-grow: 1;
    }

    .track-title {
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .player-btn {
      background: none;
      border: none;
      color: #ff2a2a;
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease;
    }

    .player-btn:hover {
      transform: scale(1.2);
    }

    .volume-slider {
      width: 75px;
      accent-color: #ff2a2a;
      cursor: pointer;
    }

    .link-card {
      width: 100%;
      padding: 14px 18px;
      background: rgba(20, 20, 20, 0.7);
      border: 1.5px solid #ff2a2a;
      border-radius: 18px;
      text-align: center;
      text-decoration: none;
      transition: all 0.25s ease;
      box-shadow: 0 0 8px rgba(255, 42, 42, 0.15);
    }

    .link-card:hover {
      background: rgba(255, 42, 42, 0.2);
      transform: translateY(-2px);
      box-shadow: 0 0 15px rgba(255, 42, 42, 0.4);
    }

    .link-name {
      display: block;
      color: #ff2a2a;
      font-weight: 800;
      font-size: 15px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .link-desc {
      display: block;
      color: #e5e5e5;
      font-size: 12px;
      margin-top: 3px;
    }

    .video-wrapper {
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 18px;
      overflow: hidden;
      border: 1.5px solid rgba(255, 255, 255, 0.15);
      margin-top: 8px;
    }

    .video-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-block">
      <img class="avatar" src="avatar.jpg" alt="Avatar">
      <h1 class="title">lokirop</h1>
      <p class="subtitle">Мои социальные сети</p>
    </div>

    <!-- Аудиоплеер для ПК -->
    <div class="audio-player">
      <div class="track-info">
        <span style="color:#ff2a2a;">🔥</span>
        <span class="track-title" id="trackTitle">SHOW MORGENSHTERN</span>
      </div>
      <div class="player-controls">
        <button class="player-btn" id="playBtn" title="Воспроизведение/Пауза">▶</button>
        <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.05" value="0.5" title="Громкость">
      </div>
    </div>
    
    <!-- Файл трека загружается из твоего репозитория -->
    <audio id="audioEl" src="track.mp3" preload="auto"></audio>

    <!-- Кнопки -->
    <a href="https://t.me/MORGENlokirop" target="_blank" class="link-card">
      <span class="link-name">Telegram</span>
      <span class="link-desc">Основной канал с новостями</span>
    </a>

    <a href="https://instagram.com/lokiropik" target="_blank" class="link-card">
      <span class="link-name">Instagram</span>
      <span class="link-desc">Новости про моргенштерна</span>
    </a>

    <a href="https://discord.gg/rtJWEZkEp8" target="_blank" class="link-card">
      <span class="link-name">Discord</span>
      <span class="link-desc">Превьюшки с ютуба и не только</span>
    </a>

    <a href="https://tiktok.com/@lokirophop" target="_blank" class="link-card">
      <span class="link-name">Tik Tok</span>
      <span class="link-desc">Короткие видео и эдиты</span>
    </a>

    <a href="https://youtube.com/@lokirop" target="_blank" class="link-card">
      <span class="link-name">YouTube</span>
      <span class="link-desc">Ютуб канал</span>
    </a>

    <a href="https://donationalerts.com/r/lokirop" target="_blank" class="link-card">
      <span class="link-name">DonationAlerts</span>
      <span class="link-desc">Поддержать автора 💰</span>
    </a>

    <a href="https://dalink.to/lokirop" target="_blank" class="link-card">
      <span class="link-name">Donation</span>
      <span class="link-desc">Поддержать автора 💰</span>
    </a>

    <div class="video-wrapper">
      <iframe src="https://www.youtube.com/embed/wUotiScDaos" allowfullscreen></iframe>
    </div>
  </div>

  <script>
    const audio = document.getElementById('audioEl');
    const playBtn = document.getElementById('playBtn');
    const volumeSlider = document.getElementById('volumeSlider');

    audio.volume = 0.5;

    playBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (audio.paused) {
        audio.play().then(() => {
          playBtn.textContent = '⏸';
        }).catch(err => console.log(err));
      } else {
        audio.pause();
        playBtn.textContent = '▶';
      }
    });

    volumeSlider.addEventListener('input', (e) => {
      audio.volume = e.target.value;
    });

    audio.addEventListener('ended', () => {
      playBtn.textContent = '▶';
    });

    // Автостарт музыки при первом клике на ПК
    if (window.innerWidth >= 768) {
      let started = false;
      const startOnInteraction = () => {
        if (!started) {
          started = true;
          audio.play().then(() => {
            playBtn.textContent = '⏸';
          }).catch(() => {});
          document.removeEventListener('click', startOnInteraction);
        }
      };
      document.addEventListener('click', startOnInteraction);
    }
  </script>
</body>
</html>
