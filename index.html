<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мои соцсети</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: #0d0d0d url('https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=800') center/cover fixed no-repeat;
      color: #fff;
      display: flex;
      justify-content: center;
      padding: 30px 15px;
      min-height: 100vh;
    }

    /* Полупрозрачная подложка для контента */
    .container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(10px);
      padding: 24px 16px;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Аватарка */
    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #ff2a2a;
      box-shadow: 0 0 15px rgba(255, 42, 42, 0.4);
    }

    .title {
      font-size: 22px;
      font-weight: 800;
      color: #ff2a2a;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .subtitle {
      font-size: 14px;
      color: #aaa;
      margin-top: -10px;
    }

    /* Кнопки соцсетей */
    .link-card {
      width: 100%;
      padding: 14px 18px;
      background: rgba(20, 20, 20, 0.7);
      border: 1.5px solid #ff2a2a;
      border-radius: 18px;
      text-align: center;
      text-decoration: none;
      transition: all 0.25s ease;
      box-shadow: 0 0 8px rgba(255, 42, 42, 0.15);
    }

    .link-card:hover {
      background: rgba(255, 42, 42, 0.2);
      transform: translateY(-2px);
      box-shadow: 0 0 15px rgba(255, 42, 42, 0.4);
    }

    .link-name {
      display: block;
      color: #ff2a2a;
      font-weight: 800;
      font-size: 15px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .link-desc {
      display: block;
      color: #e5e5e5;
      font-size: 12px;
      margin-top: 3px;
    }

    /* Блок с видео */
    .video-wrapper {
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 18px;
      overflow: hidden;
      border: 1.5px solid rgba(255, 255, 255, 0.15);
      margin-top: 8px;
    }

    .video-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Твоя аватарка -->
    <img class="avatar" src="https://via.placeholder.com/150" alt="Avatar">
    
    <h1 class="title">Твой Никнейм</h1>
    <p class="subtitle">Мои социальные сети</p>

    <!-- Кнопки -->
    <a href="https://t.me/твой_логин" target="_blank" class="link-card">
      <span class="link-name">Telegram</span>
      <span class="link-desc">Основной канал с новостями</span>
    </a>

    <a href="https://tiktok.com/@твой_логин" target="_blank" class="link-card">
      <span class="link-name">Tik Tok</span>
      <span class="link-desc">Короткие видео и эдиты</span>
    </a>

    <a href="https://youtube.com/@твой_логин" target="_blank" class="link-card">
      <span class="link-name">YouTube</span>
      <span class="link-desc">Длинные ролики и стримы</span>
    </a>

    <a href="https://donationalerts.com/r/твой_логин" target="_blank" class="link-card">
      <span class="link-name">Донат</span>
      <span class="link-desc">Поддержать автора 💰</span>
    </a>

    <!-- Встроенное видео (замени ID видео в ссылке) -->
    <div class="video-wrapper">
      <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" allowfullscreen></iframe>
    </div>
  </div>

</body>
</html>
