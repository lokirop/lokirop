<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мои соцсети</title>
  <link rel="icon" href="avatar.jpg">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: #0d0d0d url('bg.jpg') center/cover fixed no-repeat;
      color: #fff;
      display: flex;
      justify-content: center;
      padding: 30px 15px;
      min-height: 100vh;
    }

    /* Полупрозрачная подложка для контента (по умолчанию для телефонов) */
    .container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(10px);
      padding: 0 16px 24px 16px;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      overflow: hidden;
      transition: max-width 0.3s ease;
    }

    /* На экранах ПК делаем карточку шире */
    @media (min-width: 768px) {
      .container {
        max-width: 580px;
        padding: 0 24px 28px 24px;
      }
      .header-block {
        width: calc(100% + 48px) !important;
        margin: 0 -24px 12px -24px !important;
        padding: 32px 24px 24px 24px !important;
      }
    }

    /* Верхняя секция (шапка) */
    .header-block {
      width: calc(100% + 32px);
      margin: 0 -16px 8px -16px;
      padding: 28px 16px 20px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      background: linear-gradient(to bottom, rgba(0, 0, 0, 0.2) 0%, rgba(0, 0, 0, 0.85) 100%), url('header-bg.jpg') center/cover no-repeat;
      border-bottom: none;
    }

    /* Аватарка */
    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #ff2a2a;
      box-shadow: 0 0 15px rgba(255, 42, 42, 0.4);
    }

    .title {
      font-size: 22px;
      font-weight: 800;
      color: #ff2a2a;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .subtitle {
      font-size: 14px;
      color: #ccc;
    }

    /* Плеер Моргенштерна для ПК */
    .audio-player {
      display: none;
      width: 100%;
      padding: 10px 16px;
      background: rgba(15, 15, 15, 0.85);
      border: 1.5px solid #ff2a2a;
      border-radius: 16px;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: 0 0 12px rgba(255, 42, 42, 0.25);
    }

    @media (min-width: 768px) {
      .audio-player {
        display: flex;
      }
    }

    .track-info {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      flex-grow: 1;
    }

    .track-title {
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .player-btn {
      background: none;
      border: none;
      color: #ff2a2a;
      cursor: pointer;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease;
    }

    .player-btn:hover {
      transform: scale(1.2);
    }

    .volume-slider {
      width: 75px;
      accent-color: #ff2a2a;
      cursor: pointer;
    }

    /* Скрытый фрейм YouTube */
    #ytPlayerContainer {
      position: absolute;
      top: -9999px;
      left: -9999px;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    /* Кнопки соцсетей */
    .link-card {
      width: 100%;
      padding: 14px 18px;
      background: rgba(20, 20, 20, 0.7);
      border: 1.5px solid #ff2a2a;
      border-radius: 18px;
      text-align: center;
      text-decoration: none;
      transition: all 0.25s ease;
      box-shadow: 0 0 8px rgba(255, 42, 42, 0.15);
    }

    .link-card:hover {
      background: rgba(255, 42, 42, 0.2);
      transform: translateY(-2px);
      box-shadow: 0 0 15px rgba(255, 42, 42, 0.4);
    }

    .link-name {
      display: block;
      color: #ff2a2a;
      font-weight: 800;
      font-size: 15px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .link-desc {
      display: block;
      color: #e5e5e5;
      font-size: 12px;
      margin-top: 3px;
    }

    /* Блок с видео */
    .video-wrapper {
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 18px;
      overflow: hidden;
      border: 1.5px solid rgba(255, 255, 255, 0.15);
      margin-top: 8px;
    }

    .video-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Шапка -->
    <div class="header-block">
      <img class="avatar" src="avatar.jpg" alt="Avatar">
      <h1 class="title">lokirop</h1>
      <p class="subtitle">Мои социальные сети</p>
    </div>

    <!-- Кастомный плеер Моргенштерна -->
    <div class="audio-player">
      <div class="track-info">
        <span style="color:#ff2a2a;">🔥</span>
        <span class="track-title" id="trackTitle">Загрузка музыки...</span>
      </div>
      <div class="player-controls">
        <button class="player-btn" id="playBtn" title="Воспроизведение/Пауза">▶</button>
        <button class="player-btn" id="nextBtn" title="Случайный трек">⏭</button>
        <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="50" title="Громкость">
      </div>
    </div>

    <!-- Скрытый плеер YouTube -->
    <div id="ytPlayerContainer">
      <div id="yt-player"></div>
    </div>

    <!-- Кнопки соцсетей -->
    <a href="https://t.me/MORGENlokirop" target="_blank" class="link-card">
      <span class="link-name">Telegram</span>
      <span class="link-desc">Основной канал с новостями</span>
    </a>

    <a href="https://instagram.com/lokiropik" target="_blank" class="link-card">
      <span class="link-name">Instagram</span>
      <span class="link-desc">Новости про моргенштерна</span>
    </a>

    <a href="https://discord.gg/rtJWEZkEp8" target="_blank" class="link-card">
      <span class="link-name">Discord</span>
      <span class="link-desc">Превьюшки с ютуба и не только</span>
    </a>

    <a href="https://tiktok.com/@lokirophop" target="_blank" class="link-card">
      <span class="link-name">Tik Tok</span>
      <span class="link-desc">Короткие видео и эдиты</span>
    </a>

    <a href="https://youtube.com/@lokirop" target="_blank" class="link-card">
      <span class="link-name">YouTube</span>
      <span class="link-desc">Ютуб канал</span>
    </a>

    <a href="https://donationalerts.com/r/lokirop" target="_blank" class="link-card">
      <span class="link-name">DonationAlerts</span>
      <span class="link-desc">Поддержать автора 💰</span>
    </a>

    <a href="https://dalink.to/lokirop" target="_blank" class="link-card">
      <span class="link-name">Donation</span>
      <span class="link-desc">Поддержать автора 💰</span>
    </a>

    <!-- Встроенное видео -->
    <div class="video-wrapper">
      <iframe src="https://www.youtube.com/embed/wUotiScDaos" allowfullscreen></iframe>
    </div>
  </div>

  <!-- Скрипт официального YouTube API -->
  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    // Список треков Моргенштерна с официального YouTube/YouTube Music
    const playlist = [
      { id: "x30YOmbcVcA", title: "MORGENSHTERN - Cadillac" },
      { id: "eXW7b3w_Nzg", title: "MORGENSHTERN - CRISTAL & МОЁТ" },
      { id: "9aW5V3vU2b4", title: "MORGENSHTERN - ARISTOCRAT" },
      { id: "rS1o8N5g4j8", title: "MORGENSHTERN - SHOW" },
      { id: "gX21f9PZ3xU", title: "MORGENSHTERN - ЧЁРНЫЙ РУССКИЙ" },
      { id: "wUotiScDaos", title: "MORGENSHTERN - ПОВОД" }
    ];

    let player;
    let currentTrackIndex = -1;
    let isReady = false;

    const playBtn = document.getElementById('playBtn');
    const nextBtn = document.getElementById('nextBtn');
    const trackTitle = document.getElementById('trackTitle');
    const volumeSlider = document.getElementById('volumeSlider');

    function onYouTubeIframeAPIReady() {
      const randomIndex = Math.floor(Math.random() * playlist.length);
      currentTrackIndex = randomIndex;
      const initialTrack = playlist[currentTrackIndex];

      player = new YT.Player('yt-player', {
        height: '1',
        width: '1',
        videoId: initialTrack.id,
        playerVars: {
          'autoplay': 0,
          'controls': 0,
          'disablekb': 1,
          'fs': 0,
          'rel': 0
        },
        events: {
          'onReady': onPlayerReady,
          'onStateChange': onPlayerStateChange
        }
      });
    }

    function onPlayerReady() {
      isReady = true;
      player.setVolume(50);
      trackTitle.textContent = playlist[currentTrackIndex].title;
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        playBtn.textContent = '⏸';
      } else if (event.data === YT.PlayerState.PAUSED) {
        playBtn.textContent = '▶';
      } else if (event.data === YT.PlayerState.ENDED) {
        playRandomTrack();
      }
    }

    function playRandomTrack() {
      if (!isReady) return;
      let nextIndex;
      do {
        nextIndex = Math.floor(Math.random() * playlist.length);
      } while (playlist.length > 1 && nextIndex === currentTrackIndex);

      currentTrackIndex = nextIndex;
      const track = playlist[currentTrackIndex];
      trackTitle.textContent = track.title;
      player.loadVideoById(track.id);
      player.playVideo();
    }

    playBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!isReady) return;
      const state = player.getPlayerState();
      if (state === YT.PlayerState.PLAYING) {
        player.pauseVideo();
      } else {
        player.playVideo();
      }
    });

    nextBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      playRandomTrack();
    });

    volumeSlider.addEventListener('input', (e) => {
      if (isReady) {
        player.setVolume(e.target.value);
      }
    });

    // Автостарт воспроизведения при первом клике на ПК
    if (window.innerWidth >= 768) {
      let started = false;
      const startOnFirstClick = () => {
        if (!started && isReady) {
          started = true;
          player.playVideo();
          document.removeEventListener('click', startOnFirstClick);
        }
      };
      document.addEventListener('click', startOnFirstClick);
    }
  </script>
</body>
</html>
